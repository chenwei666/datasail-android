name: Publish verified DataSail V0.12.2
on:
  push:
    branches: [release-assets/V0.12.2]
    paths:
      - release-upload/V0.12.2/**
      - scripts/publish-v0122.py
      - .github/workflows/publish-v0122.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-datasail-v0122
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'chenwei666/datasail-android' && github.ref == 'refs/heads/release-assets/V0.12.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and publish the previously tested APK and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-v0122.py
      - name: Record the actual publication result on the delivery branch
        if: always()
        shell: bash
        run: |
          if [ ! -f publication/V0.12.2.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/V0.12.2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V0.12.2 publication result'
            git push origin HEAD:release-assets/V0.12.2
          fi
