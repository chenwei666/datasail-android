name: Publish verified DataSail V0.13.0
on:
  push:
    branches: [release-assets/V0.13.0]
    paths:
      - release-upload/V0.13.0/**
      - scripts/publish-v0130.py
      - .github/workflows/publish-v0130.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-datasail-v0130
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'chenwei666/datasail-android' && github.ref == 'refs/heads/release-assets/V0.13.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and publish the previously tested APK and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-v0130.py
      - name: Record the actual publication result on the delivery branch
        if: always()
        shell: bash
        run: |
          if [ ! -f publication/V0.13.0.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/V0.13.0.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V0.13.0 publication result'
            git push origin HEAD:release-assets/V0.13.0
          fi
