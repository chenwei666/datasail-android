[versions]
mongodb = "5.6.5"
conscrypt = "2.7.0"
asm = "9.8"
agp = "8.13.0"
kotlin = "2.2.10"
compose-bom = "2025.08.01"
activity = "1.10.1"
lifecycle = "2.9.2"
coroutines = "1.10.2"
mssql = "13.6.0.jre8"
mariadb = "3.5.10"
postgresql = "42.7.14"
junit = "4.13.2"
android-test = "1.2.1"
test-runner = "1.6.2"

[libraries]
mongodb = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
junit = { module = "junit:junit", version.ref = "junit" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test" }
android-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
